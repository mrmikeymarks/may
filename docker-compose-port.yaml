# Dev-image deployment: runs the published dev build of this fork
# (ghcr.io/mrmikeymarks/may) instead of building locally. Equivalent to
# docker-compose.yml (may + mailpit) minus the optional database profiles.
#
# CLI (stack.env supplies the ${VAR} values):
#   docker compose -f docker-compose-port.yaml --env-file stack.env up -d
# Portainer: deploy from the repository and define the stack.env variables
# in the stack's environment variables section.
#
# Web UI: http://localhost:5050 - Mailpit inbox: http://localhost:8025

services:
  may:
    image: ${MAY_IMAGE:-ghcr.io/mrmikeymarks/may:dev}
    pull_policy: always
    container_name: ${MAY_CONTAINER_NAME:-may}
    restart: unless-stopped
    ports:
      - "${MAY_PORT:-5050}:5050"
    volumes:
      - may_dev_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/may.db}
      - UPLOAD_FOLDER=/app/data/uploads
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-your-secure-password}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SENDER=${SMTP_SENDER:-may@localhost}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME:-May}
      - SMTP_TLS=${SMTP_TLS:-false}
      - SMTP_SSL=${SMTP_SSL:-false}
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit
    container_name: may-dev-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      - MP_DATABASE=/data/mailpit.db
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    volumes:
      - may_dev_mailpit_data:/data

volumes:
  may_dev_data:
  may_dev_mailpit_data:
